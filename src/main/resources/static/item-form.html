<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>

    ">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Inventory Management System</h1>
        <p>Manage inventory and stock levels</p>
    </div>

    <div class="card">
        <h2>Add Item</h2>

        <form id="itemForm">
            <input type="text" id="name" placeholder="Item Name" required>
            <input type="text" id="sku" placeholder="SKU" required>
            <input type="text" id="category" placeholder="Category" required>
            <input type="number" id="quantity" placeholder="Quantity" required>
            <input type="number" step="0.01" id="unitPrice" placeholder="Unit Price" required>
            <input type="number" id="reorderLevel" placeholder="Reorder Level" required>

            <button type="submit">Save Item</button>
        </form>
    </div>

    <div class="card">
        <h2>Current Stock</h2>

        <table id="inventoryTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>SKU</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Price</th>
            </tr>
            </thead>

            <tbody>
            </tbody>
        </table>
    </div>

</div>

/app.js

</body>
</html>
